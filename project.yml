name: Docket
options:
  bundleIdPrefix: com.namanparashar
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.10" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Manual, and a real identity rather than ad-hoc. macOS will not offer
    # location consent to an ad-hoc signed app - the request returns with the
    # status unchanged and no prompt at all - because there is no stable
    # identity for the grant to be attached to. Automatic signing needs an
    # Xcode account configured; manual only needs the certificate.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: nparashar150@gmail.com (WTSX2PXS5C)"
    DEVELOPMENT_TEAM: DAK6X938S3

targets:
  Docket:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
    settings:
      base:
        PRODUCT_NAME: Docket
        # Deliberately still the old name. macOS keys a saved setup's location
        # in Application Support, and every permission the user has granted,
        # to the bundle identifier. Renaming it would move the one and revoke
        # the other, to change a string nobody ever sees.
        PRODUCT_BUNDLE_IDENTIFIER: com.namanparashar.plinth
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Docket.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Renders the real views into PNGs for the README.
  #
  # Its own target rather than a flag on the app, so nothing that exists only
  # to make documentation ships inside the thing people download. It compiles
  # the same sources minus the app's own entry point, which owns @main.
  Shots:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "App/DocketApp.swift"
      - path: Tools/Shots
    settings:
      base:
        PRODUCT_NAME: Shots
        PRODUCT_BUNDLE_IDENTIFIER: com.namanparashar.plinth.shots
        CODE_SIGN_ENTITLEMENTS: Resources/Docket.entitlements
        ENABLE_APP_SANDBOX: NO

  DocketTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the pure core directly instead of hosting the app: these are
    # maths and catalog invariants, and a test host would only add launch cost.
    sources:
      - path: Tests
      - path: Sources/Core
      - path: Sources/Widgets/WidgetCatalog.swift
      - path: Sources/DockPanel/DockLayout.swift
      - path: Sources/Services/PollGate.swift
      - path: Sources/DockPanel/ScrollRelay.swift
      - path: Sources/DockPanel/MissionControlGesture.swift
      - path: Sources/Services/PagePreview.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namanparashar.plinth.tests
        GENERATE_INFOPLIST_FILE: YES
